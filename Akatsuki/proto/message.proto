syntax = "proto3";

package message;

option go_package = "./message";


service IniciarCombate {
    rpc IniciarCombate (Equipos) returns (Empty);
}

message DatosEquipo {
    string nombreEquipo = 1;
    int32 ataque = 2;
    int32 vida = 3;
}

message Equipos {
    DatosEquipo ninja = 1;
    DatosEquipo rival = 2;
}

message EstadoCombate {
    string estadoFinal = 1;
    bool combateIniciado = 2;
}

message Empty {}